<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Obys — Design &amp; Development Agency</title>
<meta name="description" content="Obys is a concept-driven design studio founded in 2018, based in the EU. Recreación no oficial del sitio obys.agency con fines de estudio." />
<link rel="preconnect" href="https://api.fontshare.com" />
<link rel="preconnect" href="https://cms.obys.agency" />
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=swap" />
<link rel="stylesheet" href="/css/base.css" />
<link rel="stylesheet" href="/css/components.css" />
<link rel="stylesheet" href="/css/home.css" />
</head>
<body data-page="work">

<div data-include-preloader></div>
<div data-include-header></div>

<main class="home" data-home>
  <div class="home__viewport">
    <!-- Columna izquierda: nombres. Se desplaza en sincronía con la tira. -->
    <aside class="home__list" aria-label="Selected work">
      <div class="home__list-track" data-list-track></div>
    </aside>

    <!-- Centro: tira de imágenes con bucle infinito + paréntesis fijo. -->
    <div class="home__stage">
      <div class="home__filmstrip" data-filmstrip aria-hidden="true"></div>
      <div class="home__mark" data-mark="bracket" aria-hidden="true"></div>
    </div>

    <!-- Derecha: texto del estudio. -->
    <aside class="home__about">
      <p class="home__about-copy">The studio is shaped by people who care deeply about design and the process behind. Each project becomes a case study and a meaningful part of our portfolio, developed with care and attention.</p>
      <p class="home__contact-label">Contact:</p>
      <a href="mailto:info@obys.agency" class="home__contact-email">info@obys.agency</a>
    </aside>

    <!-- Fila de metadatos, fija en el centro vertical junto al activo. -->
    <div class="home__meta" data-meta aria-live="polite">
      <span class="home__meta-category" data-meta-category></span>
      <span class="home__meta-services" data-meta-services></span>
      <span class="home__meta-number" data-meta-number></span>
    </div>
  </div>

  <!-- Vista Grid: scroll nativo, fuera del viewport interceptado. -->
  <div class="home__grid-view" data-grid-view></div>

  <div class="home__bottom">
    <div class="home__view-toggle" data-view-toggle role="tablist" aria-label="Work view">
      <button type="button" class="is-on" data-view="vertical" role="tab" aria-selected="true">Vertical</button><span>,</span>
      <button type="button" data-view="horizontal" role="tab" aria-selected="false">Horizontal</button><span>,</span>
      <button type="button" data-view="grid" role="tab" aria-selected="false">Grid</button>
    </div>
  </div>
</main>

<div data-include-footer></div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="/js/svg-marks.js"></script>
<script src="/js/data-projects.js"></script>
<script src="/js/site.js"></script>
<script src="/js/home.js"></script>
</body>
</html>
